[project]
name = "clara"
version = "0.1.0"
description = "An AI agent and assistant framework"
readme = "README.md"
authors = [
    { name = "Aryan-202", email = "aryanvishwakarma275@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "websockets>=13.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.48.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
clara = "clara.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clara*"]
exclude = ["tests*", "docs*", "scripts*", "release*"]
