name: Documentation

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'clara/**'
      - 'docs/**'
      - 'scripts/build_docs.*'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'clara/**'
      - 'docs/**'
      - 'scripts/build_docs.*'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'

jobs:
  build-docs:
    name: Build & Validate Sphinx Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build documentation (Strict - fail on warnings)
        run: |
          python scripts/build_docs.py --strict

      - name: Upload HTML documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/build/html/
          retention-days: 7
